# railway.toml — API service configuration
# The bot is a separate Railway service — configure it in the Railway UI:

[deploy]
healthcheckTimeout      = 30
restartPolicyType       = "ON_FAILURE"
restartPolicyMaxRetries = 3
preDeployCommand        = ["sh", "-c", "command -v node >/dev/null 2>&1 && node artifacts/api-server/dist/migrate.mjs || true"]

# railway.toml — API service configuration
# The bot is a separate Railway service — configure it in the Railway UI:

[deploy]
# Push schema before the new API version goes live
releaseCommand = "corepack enable && corepack prepare pnpm@latest --activate && pnpm --filter @workspace/db push --force"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
